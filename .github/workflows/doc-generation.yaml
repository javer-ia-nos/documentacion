name: Build Typst document
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compile Typst documents
        run: |
          typst compile docs/bitacora.typ --input version="${{ github.ref_name }}"
          typst compile docs/arch-description.typ --input version="${{ github.ref_name }}"
          typst compile docs/dev.typ --input version="${{ github.ref_name }}"

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: docs/*.pdf

      - name: Get current date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d-%H:%M)" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          name: "${{ github.ref_name }}"
          files: |
            docs/bitacora.pdf
            docs/arch-description.pdf
